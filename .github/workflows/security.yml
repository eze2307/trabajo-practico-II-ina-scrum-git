name: Security Checks

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit safety
      - name: Run pip-audit (if requirements.txt exists)
        run: |
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt || true; else echo "No requirements.txt, skipping pip-audit"; fi
      - name: Run bandit
        run: bandit -r . -x build -n 5 || true
      - name: Run safety (if requirements.txt exists)
        run: |
          if [ -f requirements.txt ]; then safety check -r requirements.txt || true; else echo "No requirements.txt, skipping safety"; fi
